# JARVIS Steve Energy Card – Dashboard-Kartenkonfiguration
type: custom:jarvis-steve-energy-card
background_image: /hacsfiles/jarvis-steve-energy-card/Steve_Energie_Background.png
flow_threshold_w: 10
animations: true
auto_discover_rooms: true
auto_switch_activity: true
exclude_entities: []
tariff_helpers:
  import: input_number.steve_bezugstarif_ct
  export: input_number.steve_einspeisetarif_ct
grid_sign_verified: false
grid_import_positive_verified: true  # Positiver OBI-Netzbezug durch Schaltversuch bestaetigt
entities:
  pv: sensor.solis_inverter_ac_power
  house: sensor.steve_hausverbrauch_berechnet
  imp:
  exp:
  meter: sensor.obi_energy_bridge_aktuelle_leistung
  pvDay: sensor.solis_inverter_generation_today
  gridImportDay: sensor.solis_grid_import_today
  exportDay: sensor.solis_grid_export_today
  houseDay: sensor.solis_home_load_today
  monthImport: sensor.obi_energy_bridge_steve_netzbezug_monat
  monthExport: sensor.obi_energy_bridge_steve_einspeisung_monat
  pvMonth: sensor.solis_inverter_generation_this_month
  cost:
  cash:
  revenue:
  autonomyDay:
  selfMonth:
  rate:
